<canvas #bgCanvas id="bg-canvas"></canvas>
<div class="overlay"></div>

<div class="auth-container">
  <div class="logo-area">
    <span class="icon"></span>
    <h1>MAZE HUNTER</h1>
    <p>// BLACK BOX TESTING //</p>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="testeur@maze.com" required>
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" formControlName="password" placeholder="••••••••" required>
    </div>
    <button class="btn-primary" type="submit">Se connecter</button>
  </form>

  <button class="btn-secondary" (click)="router.navigate(['/signup'])">Créer un compte</button>

  <div class="auth-link">
    <a href="#">Mot de passe oublié ?</a>
  </div>

  <div class="kong-mini">█ █ █ █ █</div>
</div>
