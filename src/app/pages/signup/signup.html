<canvas #bgCanvas id="bg-canvas"></canvas>
<div class="overlay"></div>

<div class="auth-container">
  <div class="logo-area">
    <h1>MAZE HUNTER</h1>
    <p>// BLACK BOX TESTING //</p>
  </div>

  <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
    <div class="form-row">
      <div class="form-group">
        <label>Prénom</label>
        <input type="text" formControlName="firstName" placeholder="Kong" required>
      </div>
      <div class="form-group">
        <label>Nom</label>
        <input type="text" formControlName="lastName" placeholder="Hunter" required>
      </div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="testeur@maze.com" required>
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" formControlName="password" placeholder="••••••••" required minlength="6">
    </div>
    <div class="form-group">
      <label>Confirmer</label>
      <input type="password" formControlName="confirmPassword" placeholder="••••••••" required>
    </div>

    <div class="terms">
      <input type="checkbox" id="terms" formControlName="terms" required>
      <label for="terms">J'accepte les <a href="#">conditions d'utilisation</a></label>
    </div>

    <button class="btn-primary" type="submit">Créer mon compte</button>
  </form>

  <button class="btn-secondary" (click)="router.navigate(['/login'])">Déjà inscrit ? Se connecter</button>
</div>
