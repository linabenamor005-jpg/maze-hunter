<div class="overlay"></div>

<div class="auth-container">
  <div class="logo-area">
    <span class="icon">◆</span>
    <h1>MAZE HUNTER</h1>
    <p>// CRÉATION COMPTE ADMIN //</p>
  </div>

  <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Prénom</label>
      <input type="text" formControlName="firstName" placeholder="Prénom" required>
    </div>
    <div class="form-group">
      <label>Email administrateur</label>
      <input type="email" formControlName="email" placeholder="admin@maze.com" required>
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" formControlName="password" placeholder="6 caractères min." required>
    </div>
    <div class="form-group">
      <label>Confirmer le mot de passe</label>
      <input type="password" formControlName="confirmPassword" placeholder="••••••••" required>
    </div>
    <div class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>
    <button class="btn-primary" type="submit">Créer le compte</button>
  </form>

  <button class="btn-secondary" (click)="router.navigate(['/admin/login'])">J'ai déjà un compte</button>

  <div class="auth-link">
    <a (click)="router.navigate(['/login'])">← Retour à l'espace testeur</a>
  </div>
</div>
